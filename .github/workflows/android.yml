name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash   # bash -eo pipefail: un fallo dentro de '| tee' hace fallar el paso

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar, probar y generar APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: SDK de Android preinstalado
        run: echo "ANDROID_HOME=$ANDROID_HOME"; ls $ANDROID_HOME/platforms $ANDROID_HOME/build-tools | tail -5

      - name: Commit compilado
        run: |
          echo "Commit: $GITHUB_SHA" | tee build-info.txt
          echo "Run: $GITHUB_RUN_NUMBER" >> build-info.txt
          echo "Fecha: $(date -u +%FT%TZ)" >> build-info.txt

      - name: Escaneo de secretos (falla si hay claves privadas en el repo)
        run: |
          set -e
          if git grep -nE '(service_role|SUPABASE_SERVICE|gsk_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,}|-----BEGIN (RSA |EC )?PRIVATE KEY-----|eyJhbGciOiJIUzI1NiIs[A-Za-z0-9._-]{40,})' -- ':!.github/workflows/android.yml' ':!docs/*'; then
            echo "::error::Posible secreto encontrado"; exit 1
          fi
          if git ls-files | grep -E '\.(jks|keystore)$'; then echo "::error::Keystore en el repo"; exit 1; fi

      - name: Pruebas unitarias
        run: ./gradlew --stacktrace testDebugUnitTest 2>&1 | tee unit-tests.log

      - name: Lint
        run: ./gradlew --stacktrace lintDebug 2>&1 | tee lint.log

      - name: Compilar APK debug
        run: ./gradlew --stacktrace assembleDebug 2>&1 | tee build.log

      - name: Verificar APK
        run: |
          set -e
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          SIZE=$(stat -c%s "$APK")
          echo "Tamaño APK: $SIZE bytes" | tee -a build-info.txt
          if [ "$SIZE" -lt 1000000 ] || [ "$SIZE" -gt 150000000 ]; then echo "::error::Tamaño de APK fuera de rango"; exit 1; fi
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt2 | tail -1)
          $AAPT dump badging "$APK" | grep -iE "^package:|uses-permission|sdkVersion|native-code" | tee -a build-info.txt
          sha256sum "$APK" | tee -a build-info.txt
          cp "$APK" "driverai-debug-${GITHUB_SHA::7}.apk"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: driverai-debug-apk-${{ github.run_number }}
          path: |
            driverai-debug-*.apk
            build-info.txt
          retention-days: 30

      - name: Publicar logs y reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.run_number }}
          path: |
            *.log
            build-info.txt
            app/build/reports/
            app/build/test-results/
          retention-days: 14

  backend-contract:
    name: Contrato con backend real (Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Prueba de contrato en vivo
        env:
          LIVE_BACKEND: '1'
        run: ./gradlew testDebugUnitTest --tests 'ar.driverai.bridge.LiveBackendContractTest' 2>&1 | tee contract.log
      - name: Regresión de la web publicada
        run: |
          set -e
          code=$(curl -s -o /dev/null -w '%{http_code}' https://driverai-ba.lovable.app)
          echo "Web publicada: HTTP $code"; test "$code" = "200"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contract-${{ github.run_number }}
          path: contract.log

  emulator:
    name: Pruebas instrumentadas (emulador)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compilar APKs de prueba
        run: ./gradlew assembleDebug assembleDebugAndroidTest
      - name: Ejecutar en emulador (API 30, imagen AOSP liviana)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          cores: 2
          ram-size: 3072M
          disk-size: 4096M
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -feature -Vulkan
          script: bash scripts/emulator-tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-${{ github.run_number }}
          path: |
            emulator-artifacts/
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/

  release:
    name: Publicar APK en GitHub Release
    needs: [build, backend-contract, emulator]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar APK del job de compilación
        uses: actions/download-artifact@v4
        with:
          name: driverai-debug-apk-${{ github.run_number }}

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SRC=$(ls driverai-debug-*.apk)
          test -s "$SRC"
          test -s build-info.txt
          SHORT="${GITHUB_SHA::7}"
          cp "$SRC" "driverai-debug-${SHORT}.apk"
          cp "$SRC" driverai-debug.apk
          NOTES_FILE=$(mktemp)
          cat > "$NOTES_FILE" <<EOF
          APK de depuración generado por Android CI cuando compilación, contrato con el backend y emulador terminan en verde.

          - Commit: \`${GITHUB_SHA}\`
          - Run: ${GITHUB_RUN_NUMBER}
          - El tag \`apk-${GITHUB_RUN_NUMBER}\` queda fijo.
          - \`latest-debug\` reemplaza \`driverai-debug.apk\` con esta compilación.

          No es una build de Play Store. La firma es la de depuración del runner y puede cambiar entre corridas: si Android avisa de un conflicto de paquete, desinstalá la versión anterior. Este workflow no prueba Uber Driver en un teléfono real.
          EOF
          gh release create "apk-${GITHUB_RUN_NUMBER}" \
            "driverai-debug-${SHORT}.apk" build-info.txt \
            --target "$GITHUB_SHA" \
            --title "DriverAI debug ${SHORT} (run ${GITHUB_RUN_NUMBER})" \
            --prerelease \
            --notes-file "$NOTES_FILE"
          if gh release view latest-debug >/dev/null 2>&1; then
            while read -r id name; do
              case "$name" in
                driverai-debug.apk|build-info.txt)
                  gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${id}"
                  ;;
              esac
            done < <(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/latest-debug" --jq '.assets[] | "\(.id) \(.name)"')
            gh release upload latest-debug driverai-debug.apk build-info.txt
            gh release edit latest-debug \
              --title "DriverAI debug más reciente (${SHORT})" \
              --notes-file "$NOTES_FILE"
          else
            gh release create latest-debug driverai-debug.apk build-info.txt \
              --target "$GITHUB_SHA" \
              --title "DriverAI debug más reciente (${SHORT})" \
              --latest \
              --notes-file "$NOTES_FILE"
          fi
          echo "Descarga: https://github.com/${GITHUB_REPOSITORY}/releases/download/latest-debug/driverai-debug.apk"

